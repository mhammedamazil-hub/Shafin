# Research plumbing: records which text LLMs a GitHub-hosted runner can reach
# through GitHub Models (the development sandbox has no route to any LLM API).
# Runs only when .github/vl-requests/llm-probe.json changes.
name: vl-llm-probe

on:
  push:
    branches: ["arena/**"]
    paths: [".github/vl-requests/llm-probe.json"]

permissions:
  contents: write
  models: read

concurrency:
  group: vl-llm-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 tools/ci/llm_probe.py .github/vl-requests/llm-probe.json "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/probe.log"
          { echo "rustc: $(rustc --version 2>&1)"; echo "cargo: $(cargo --version 2>&1)"; nproc; free -m | head -2; } > "$RUNNER_TEMP/out/runner.txt" 2>&1 || true
      - name: Publish to refs/vl-results/llm-probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          printf '{"run_id":"%s","source_sha":"%s","outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ steps.probe.outcome }}" > status.json
          git init -q .
          git config user.name "vl-bot"
          git config user.email "vl-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "llm probe (run $GITHUB_RUN_ID)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/vl-results/llm-probe
