# Research plumbing: records which text LLMs a GitHub-hosted runner can reach
# through GitHub Models (the development sandbox has no route to any LLM API).
# Runs only when .github/vl-requests/llm-probe.json changes.
name: vl-llm-probe

on:
  push:
    branches: ["arena/**"]
    paths: [".github/vl-requests/llm-probe.json"]

permissions:
  contents: write
  models: read

concurrency:
  group: vl-llm-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 tools/ci/llm_probe.py .github/vl-requests/llm-probe.json "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/probe.log"
          {
            echo "== curl catalog =="
            curl -sS -m 30 -D - -o "$RUNNER_TEMP/out/catalog.body" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://models.github.ai/catalog/models 2>&1 | head -40
            echo "body bytes: $(wc -c < "$RUNNER_TEMP/out/catalog.body")"; head -c 400 "$RUNNER_TEMP/out/catalog.body"; echo
            echo "== curl chat =="
            curl -sS -m 60 -D - -o "$RUNNER_TEMP/out/chat.body" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Reply with the single word: ok"}],"max_tokens":16}' https://models.github.ai/inference/chat/completions 2>&1 | head -40
            echo "body bytes: $(wc -c < "$RUNNER_TEMP/out/chat.body")"; head -c 600 "$RUNNER_TEMP/out/chat.body"; echo
            echo "== curl azure legacy =="
            curl -sS -m 60 -D - -o "$RUNNER_TEMP/out/chat2.body" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Reply with the single word: ok"}],"max_tokens":16}' https://models.inference.ai.azure.com/chat/completions 2>&1 | head -30
            echo "body bytes: $(wc -c < "$RUNNER_TEMP/out/chat2.body")"; head -c 600 "$RUNNER_TEMP/out/chat2.body"; echo
            echo "== dns =="; getent hosts models.github.ai || true; env | grep -i -E "^(https?|no)_proxy=" || echo "no proxy env"
          } > "$RUNNER_TEMP/out/curl.txt" 2>&1 || true
          { echo "rustc: $(rustc --version 2>&1)"; echo "cargo: $(cargo --version 2>&1)"; nproc; free -m | head -2; } > "$RUNNER_TEMP/out/runner.txt" 2>&1 || true
      - name: Publish to refs/vl-results/llm-probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          printf '{"run_id":"%s","source_sha":"%s","outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ steps.probe.outcome }}" > status.json
          git init -q .
          git config user.name "vl-bot"
          git config user.email "vl-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "llm probe (run $GITHUB_RUN_ID)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/vl-results/llm-probe
