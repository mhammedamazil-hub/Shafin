# Build plumbing, not part of the Visual Language itself.
#
# The development sandbox cannot reach static.rust-lang.org / crates.io / GitHub
# release-asset hosts. This workflow downloads the official Rust toolchain on a
# GitHub-hosted runner, verifies SHA-256 against the official channel manifest
# and publishes it as chunked files on the hidden, non-branch git ref
# refs/vl-bootstrap/toolchain, which the sandbox can fetch over plain git.
#
# It runs ONLY when .github/vl-requests/toolchain.json changes.
name: vl-bootstrap-toolchain

on:
  push:
    branches: ["arena/**"]
    paths: [".github/vl-requests/toolchain.json"]

permissions:
  contents: write

concurrency:
  group: vl-bootstrap-toolchain
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and chunk the toolchain
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 tools/ci/pack_toolchain.py .github/vl-requests/toolchain.json "$RUNNER_TEMP/out" 2>&1 \
            | tee "$RUNNER_TEMP/out/pack.log"

      - name: Publish bundle (or failure log) to refs/vl-bootstrap/toolchain
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          printf '{"run_id":"%s","source_sha":"%s","outcome":"%s","runner":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$PACK_OUTCOME" "$ImageOS" > status.json
          git init -q .
          git config user.name "vl-bootstrap"
          git config user.email "vl-bootstrap@users.noreply.github.com"
          git config core.compression 0
          git add -A
          git commit -q -m "Rust toolchain bundle (run $GITHUB_RUN_ID, source $GITHUB_SHA)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/vl-bootstrap/toolchain
